services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    command: start-dev
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: keycloak-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data

  primevue-app:
    build:
      context: .  # 🔹 Vue buduje się z katalogu głównego
      dockerfile: Dockerfile.frontend  # 🔹 Musi używać `Dockerfile.frontend`
    container_name: primevue-app
    ports:
      - "8081:80"
    environment:
      VITE_KEYCLOAK_URL: "http://keycloak:8080"
      API_URL: "http://fastapi-backend:8000"  # 🔹 Vue komunikuje się z backendem
    depends_on:
      - keycloak
      - fastapi-backend  # 🔹 Vue czeka na FastAPI


  fastapi-backend:
    build:
      context: .  # 🔹 Backend FastAPI znajduje się w katalogu głównym
      dockerfile: Dockerfile.backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://admin:secret@mongodb:27017"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8082:8082"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_SERVER: mongodb    

volumes:
  postgres_data:
  mongodb_data:
